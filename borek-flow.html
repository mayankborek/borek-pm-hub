<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borek Flow – Account settings & password reset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1240; --blue:#124f94; --bg:#f3f4f8; --card:#fff; --line:#e3e5ee;
  --text:#0d1240; --muted:#4e5274; --tile:#f3f4f8; --red:#b72525; --err:#c62828; --topbar:#fff;
}
body.dark{ --bg:#0a0d2e; --card:#141a4d; --line:#262d66; --text:#eef0fa; --muted:#a6abd0; --tile:#1b2260; --topbar:#0d1240; --blue:#7fb2f5; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none!important}

/* ===== App shell ===== */
.app{display:grid;grid-template-columns:215px 1fr;min-height:100vh}
.sidebar{background:var(--navy);display:flex;flex-direction:column;padding:24px 0;position:sticky;top:0;height:100vh}
.sidebar .brand{padding:0 24px;height:42px;display:flex;align-items:center}
.sidebar .brand img{height:42px;margin-left:-6px}
.sidebar nav{margin-top:22px;display:flex;flex-direction:column}
.sidebar nav a{color:#fff;padding:0 0 0 55px;height:48px;display:flex;align-items:center;font-size:14px}
.sidebar nav a.dim{color:#5b6090}
.sidebar nav a:hover{text-decoration:none;background:rgba(255,255,255,.05)}
.sidebar .foot{margin-top:auto;padding:0 24px}
.sidebar .foot img{height:36px;display:block;margin-left:-6px;margin-bottom:-6px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:70px;background:var(--topbar);display:flex;align-items:stretch;justify-content:space-between;padding-left:33px;padding-right:118px}
.topbar h2{font-size:24px;font-weight:400;display:flex;align-items:center;height:100%;padding-right:36px;min-width:286px;border-bottom:2px solid var(--navy);color:var(--text)}
body.dark .topbar h2{border-color:#7fb2f5}
.topbar .right{display:flex;align-items:center;gap:14px}
.bell{background:none;border:0;cursor:pointer;color:var(--muted);display:grid;place-items:center;width:32px;height:32px}
.userchip{display:flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:8px;font-size:12px;font-weight:500}
.userchip .av{width:32px;height:32px;background:var(--tile);display:grid;place-items:center;font-size:10px;font-weight:600}
.content{padding:30px 40px 60px 93px;max-width:1313px}
.content h1{font-size:28px;font-weight:600;letter-spacing:-.2px;line-height:1.15}
.content .sub{color:var(--muted);font-size:14px;margin-top:6px}
.settings{display:grid;grid-template-columns:210px minmax(0,830px);gap:0;margin-top:40px}
.snav{display:flex;flex-direction:column}
.snav .lbl{font-size:11px;font-weight:500;letter-spacing:.4px;color:var(--muted);padding:0 8px;margin:0 0 14px;text-transform:uppercase}
.snav a{height:52px;display:flex;align-items:center;padding-left:12px;color:var(--muted);font-size:14px;border-left:3px solid transparent;margin-left:0}
.snav a.on{color:var(--text);font-weight:600;border-left-color:var(--blue);padding-left:13px}
.snav a:hover{text-decoration:none;color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;min-height:340px}
.card h3{font-size:20px;font-weight:600}
.card .desc{color:var(--muted);font-size:13px;margin-top:6px}
.card h4{font-size:16px;font-weight:600}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;height:40px;padding:0 19px;font-size:14px;font-weight:500;cursor:pointer}
body.dark .btn{background:#2b3a9c}
.btn:hover{filter:brightness(1.15)}
.btn.danger{background:var(--red);border-radius:0;font-weight:400}
.btn.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:0;font-weight:400}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;font-size:14px}
.linkbtn:hover{text-decoration:underline}

.ident{display:flex;align-items:center;gap:16px;margin-top:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.ident .big{width:56px;height:56px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:11px;font-weight:600}
.ident .nm{font-size:20px;font-weight:500}
.ident .role{color:var(--muted);margin-top:10px}
.ident .btn{margin-left:auto;align-self:flex-start;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:19px;margin:16px 0 48px}
.tile{background:var(--tile);border-radius:8px;padding:10px 14px;min-height:66px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile span{display:block;margin-top:6px;font-size:14px;font-weight:400;line-height:1.1;overflow-wrap:anywhere}
.tile input{margin-top:4px;width:100%;border:1px solid var(--line);background:var(--card);padding:4px 6px;border-radius:4px}
.sec{margin-top:24px}
.passrow{background:var(--tile);border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.passrow b{font-weight:500;font-size:14px}
.passrow p{color:var(--muted);font-size:12px;margin-top:4px}
.hr{border:0;border-top:1px solid var(--line);margin:32px 0 28px}
.session{display:flex;justify-content:space-between;align-items:flex-start;margin-top:0}
.session .linkbtn{margin-right:46px}
.togrow{display:flex;justify-content:space-between;padding:24px 0 22px;border-top:1px solid var(--line);min-height:110px}
.togrow:first-of-type{border-top:0;padding-top:20px}
.togrow h4{font-size:15px}
.togrow p{color:var(--muted);font-size:13px;margin-top:10px}
.togctl{display:flex;align-items:flex-start;gap:36px;font-size:12px;color:var(--muted);padding-top:2px}
.sw{position:relative;width:44px;height:24px;border-radius:12px;background:#d4d7e5;border:0;cursor:pointer;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked=true]{background:#14529a}
.sw[aria-checked=true]::after{left:23px}
.select{position:relative;width:460px;margin-top:12px}
.select select{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 40px 0 15px;appearance:none;-webkit-appearance:none;font-size:14px;cursor:pointer}
.select::after{content:"";position:absolute;right:18px;top:17px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.themerow{background:var(--tile);border-radius:8px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.themerow b{font-weight:500}
.dz{margin-top:44px;font-size:12px}

/* ===== Auth screens ===== */

.hero .copy{padding:0 80px;flex:1;display:flex;flex-direction:column}
.hero h1{font-weight:300;font-size:clamp(40px,4.2vw,60px);line-height:1.04;margin-top:min(5vh,44px);letter-spacing:-.5px}
.hero p{font-size:clamp(15px,1.4vw,20px);line-height:1.45;margin-top:min(7vh,70px);max-width:520px;font-weight:300}
.hero small{margin-top:auto;padding-bottom:90px;font-size:13px}
.pane{background:#fff;color:#0d1240;display:flex;align-items:center;padding:40px 116px}
.panebody{width:100%;max-width:448px}
.pane h2{font-size:32px;font-weight:400;letter-spacing:-.2px}
.pane .lead{color:#5c6082;font-size:15px;line-height:1.35;margin-top:12px}
.pane label{display:block;font-weight:500;font-size:12px;margin-top:34px;margin-bottom:10px}
.pane label+input,.pane .hint+label+input{margin-top:0}
.pane input{display:block;width:100%;height:40px;margin-top:0;border:1px solid #6f7391;background:#fff;padding:0 27px;font-size:15px;color:#0d1240;border-radius:0}
.pane input:focus{outline:2px solid #124f94;outline-offset:0}
.pane input.bad{border-color:#c62828}
.pane .err{color:#c62828;font-size:12px;margin-top:10px}
.pane .hint{color:#5c6082;font-size:12px;margin-top:10px}
.pane .primary{display:block;width:100%;height:48px;margin-top:40px;border:0;background:#0d1240;color:#fff;font-size:14px;cursor:pointer}
.pane .primary:hover{filter:brightness(1.3)}
.pane .primary:disabled{background:#9a9cae;cursor:default;filter:none}
.pane .back{display:inline-flex;gap:6px;align-items:center;margin-top:26px;font-weight:500;font-size:14px;color:#124f94}
.pane .ms{margin-top:28px;font-size:12px}
.pane .ms b{display:block;font-weight:500;color:#4e5274;margin-bottom:14px}
.pane .ms a{font-size:12px}
.callout{background:#f3f4f8;padding:14px 16px;margin-top:28px}
.callout b{display:block;font-size:12px;font-weight:600}
.callout p{font-size:12px;color:#5c6082;line-height:1.5;margin-top:10px}
.pane .primary.after-callout{margin-top:24px}

/* ===== Modal / toast / screen picker ===== */
.scrim{position:fixed;inset:0;background:rgba(13,18,64,.5);display:grid;place-items:center;z-index:50}
.modal{background:#fff;color:#0d1240;width:416px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h5{font-size:18px;font-weight:600;color:#4e5274}
.modal p{color:#5c6082;font-size:14px;line-height:1.5;margin-top:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.modal.small{width:360px}
.modal.small h5{font-size:15px}
.modal.small p{font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0d1240;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.picker{position:fixed;right:16px;bottom:16px;z-index:80;font-size:12px}
.picker summary{list-style:none;cursor:pointer;background:#0d1240;color:#fff;padding:8px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);user-select:none}
.picker summary::-webkit-details-marker{display:none}
.picker div{position:absolute;right:0;bottom:40px;background:#fff;border:1px solid #e3e5ee;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;width:210px;color:#0d1240}
.picker a{display:block;padding:7px 10px;border-radius:6px;color:#0d1240}
.picker a:hover{background:#f3f4f8;text-decoration:none}
.picker hr{border:0;border-top:1px solid #e3e5ee;margin:4px 0}

@media (max-width:900px){
  .auth{grid-template-columns:1fr}.hero{display:none}.pane{padding:32px 24px;min-height:100vh}
  .app{grid-template-columns:1fr}.sidebar{display:none}
  .topbar{padding:0 16px}.topbar h2{min-width:0}
  .content{padding:24px 16px}.settings{grid-template-columns:1fr}.snav{flex-direction:row;flex-wrap:wrap;margin-bottom:16px}
  .snav .lbl{width:100%}.snav a{height:40px}.tiles{grid-template-columns:1fr}.select{width:100%}
}
</style>

<script>
const $=(s,r=document)=>r.querySelector(s);
const root=$('#root');
const tabs=[['profile','My profile'],['security','Security'],['notifications','Notifications'],['preferences','Preferences']];
const state={notif:{reports:true,milestones:true,changes:true},lang:'EN',dark:false,sentTo:''};

/* ---------- Toast ---------- */
let tt;function toast(m){clearTimeout(tt);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;tt=setTimeout(()=>t.remove(),2400)}

/* ---------- Settings panels ---------- */
const panels={
profile:()=>`
<h3>My profile</h3><p class="desc">Your account identity and contact details.</p>
<div class="ident"><div class="big">AM</div><div><div class="nm">Alex Morgan</div><div class="role">Senior Project Manager · Borek Solutions</div></div><button class="btn" id="edit">Edit profile</button></div>
<h4 style="margin-top:20px">Contact details</h4>
<div class="tiles" id="tiles">
 <div class="tile"><small>Email address</small><span>alex.morgan@boreksolutions.com</span></div>
 <div class="tile"><small>Workspace · Read only</small><span>Borek Solutions</span></div>
 <div class="tile"><small>Phone number</small><span id="phone">+49 30 555 0147</span></div>
</div>`,
security:()=>`
<h3>Security</h3><p class="desc">Manage your password and current session.</p>
<div class="sec"><h4>Password</h4><p class="desc">Start a secure password reset for your account.</p>
<div class="passrow"><div><b>Password</b><p>Reset your sign-in password.</p></div><button class="btn" id="resetpw">Reset password</button></div></div>
<hr class="hr">
<div class="session"><div><h4>Current session</h4><p class="desc" style="margin-top:10px">End your current Client Portal session on this device.</p></div><button class="linkbtn" id="logout">Log out</button></div>
<p class="dz"><button class="linkbtn" id="deact" style="font-size:12px;color:var(--red)">Deactivate account</button></p>`,
notifications:()=>{const r=(k,t,d)=>`<div class="togrow"><div><h4>${t}</h4><p>${d}</p></div><div class="togctl"><span>${state.notif[k]?'On':'Off'}</span><button class="sw" role="switch" aria-checked="${state.notif[k]}" aria-label="${t}" data-k="${k}"></button></div></div>`;
return `<h3>Notifications</h3><p class="desc">Choose which project updates you receive.</p><div style="margin-top:6px">`+
r('reports','Project reports','New status reports shared by your project manager.')+
r('milestones','Milestones','Changes to milestone dates and completion.')+
r('changes','Change requests','Updates on requests you submitted.')+`</div>`},
preferences:()=>`
<h3>Preferences</h3><p class="desc">Set the language and appearance for your account.</p>
<div class="sec" style="margin-top:28px"><h4>Preferred language</h4><p class="desc" style="font-size:12px">Used throughout your Client Portal.</p>
<div class="select"><select id="lang"><option value="EN">English (EN)</option><option value="DE">Deutsch (DE)</option></select></div></div>
<hr class="hr" style="margin:32px 0 26px">
<div><h4>Appearance</h4><p class="desc">Choose light or dark theme.</p>
<div class="themerow"><b>Dark theme</b><button class="sw" id="dark" role="switch" aria-checked="${state.dark}" aria-label="Dark theme"></button></div></div>`
};

function renderSettings(tab){
  root.innerHTML='';root.append($('#t-shell').content.cloneNode(true));
  $('#snav').innerHTML='<div class="lbl">Settings</div>'+tabs.map(([k,l])=>`<a href="#/${k}" class="${k===tab?'on':''}">${l}</a>`).join('');
  $('#panel').innerHTML=panels[tab]();
  root.querySelectorAll('[data-stub]').forEach(a=>a.onclick=e=>{e.preventDefault();toast('Not part of this design')});
  if(tab==='profile'){let ed=false;$('#edit').onclick=e=>{ed=!ed;const p=$('#phone');if(ed){p.outerHTML='<input id="phone" value="'+p.textContent+'">';e.target.textContent='Save'}else{const v=$('#phone').value||'+49 30 555 0147';$('#phone').outerHTML='<span id="phone">'+v.replace(/</g,'&lt;')+'</span>';e.target.textContent='Edit profile';toast('Profile updated')}}}
  if(tab==='security'){$('#resetpw').onclick=()=>{location.hash='#/forgot'};$('#logout').onclick=()=>toast('Logged out (demo)');$('#deact').onclick=openDeactivate}
  if(tab==='notifications')root.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{state.notif[b.dataset.k]=!state.notif[b.dataset.k];renderSettings('notifications')});
  if(tab==='preferences'){$('#lang').value=state.lang;$('#lang').onchange=e=>{state.lang=e.target.value;toast('Language set to '+e.target.selectedOptions[0].text)};$('#dark').onclick=()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);renderSettings('preferences')}}
}

/* ---------- Deactivate modals ---------- */
function openDeactivate(){
  const s=document.createElement('div');s.className='scrim';
  s.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h5>Deactivate account?</h5><p>You will lose access to this workspace. Continue only if you’re sure.</p><div class="acts"><button class="btn ghost" data-c>Cancel</button><button class="btn danger" data-d>Deactivate account</button></div></div>';
  document.body.append(s);
  s.onclick=e=>{if(e.target===s||e.target.hasAttribute('data-c'))s.remove();if(e.target.hasAttribute('data-d')){s.innerHTML='<div class="modal small"><h5>Account deactivated</h5><p>This account can no longer access Borek Flow.</p><div class="acts" style="justify-content:flex-start;margin-top:10px"><button class="linkbtn" style="font-size:12px;color:var(--muted)" data-c>Dismiss</button></div></div>'}}
}

/* ---------- Auth screens ---------- */
const arrow='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4 3 8l4 4"/></svg>';
const ms=`<div class="ms"><b>Using a Microsoft company account?</b><a href="#/signin-x" data-stub>Manage your password through your organization.</a></div>`;
const back=`<a class="back" href="#/signin-x" data-stub>${arrow} Back to sign in</a>`;
function authShell(inner){
  root.innerHTML=`<div class="auth"><div class="hero"><div class="photo" role="img" aria-label="Borek Flow"></div><div class="copy"><h1>Work, Moving<br>Forward.</h1><p>One workspace for project plans, team tasks, and delivery progress.</p><small>Borek Flow · Secure workspace</small></div></div><main class="pane"><div class="panebody">${inner}</div></main></div>`;
  root.querySelectorAll('[data-stub]').forEach(a=>a.onclick=e=>{e.preventDefault();toast('Sign-in is not part of this design')});
}
const views={
forgot(){
  authShell(`<h2>Forgot password?</h2><p class="lead">Enter your work email and we’ll send you a link to reset your password.</p>
  <form id="f" novalidate><label for="em">Work email *</label><input id="em" type="email" placeholder="name@borek.com" autocomplete="email" value="${state.sentTo}"><div class="err" id="er" hidden>Enter a valid email address.</div>
  <button class="primary" id="go">Send reset link</button></form>${back}${ms}`);
  const f=$('#f'),em=$('#em'),er=$('#er'),go=$('#go');
  em.oninput=()=>{em.classList.remove('bad');er.hidden=true};
  f.onsubmit=e=>{e.preventDefault();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){em.classList.add('bad');er.hidden=false;go.disabled=true;setTimeout(()=>go.disabled=false,0);return}
    state.sentTo=em.value.trim();go.disabled=true;go.textContent='Sending…';em.disabled=true;setTimeout(()=>location.hash='#/sent',900)};
},
sent(){
  authShell(`<h2>Check your email</h2><p class="lead">If an account exists for this email, you’ll receive a password reset link.</p>
  <div class="callout"><b>Check your inbox and spam folder</b><p>Use the most recent email to reset your password. Don’t receive it? Request another link.</p></div>
  <button class="primary after-callout" id="re">Resend reset link</button>${back}${ms}`);
  $('#re').onclick=()=>toast('Reset link sent again');
},
reset(){
  authShell(`<h2>Reset password</h2><p class="lead">Choose a new password for your Borek Flow account.</p>
  <form id="f" novalidate><label for="p1">New password *</label><input id="p1" type="password" value="" autocomplete="new-password">
  <div class="hint">Use a strong password that meets your organization’s requirements.</div>
  <label for="p2" style="margin-top:28px">Confirm new password *</label><input id="p2" type="password" autocomplete="new-password"><div class="err" id="er" hidden>Passwords don’t match. Enter the same password in both fields.</div>
  <button class="primary" id="go">Reset password</button></form>${back}${ms}`);
  const f=$('#f'),p1=$('#p1'),p2=$('#p2'),er=$('#er'),go=$('#go');
  const clr=()=>{p2.classList.remove('bad');er.hidden=true};p1.oninput=clr;p2.oninput=clr;
  f.onsubmit=e=>{e.preventDefault();if(!p1.value||p1.value!==p2.value){p2.classList.add('bad');er.hidden=false;if(!p1.value)er.textContent='Enter a new password.';else er.textContent='Passwords don’t match. Enter the same password in both fields.';return}
    go.disabled=true;go.textContent='Updating password…';setTimeout(()=>location.hash='#/done',900)};
},
invalid(){
  authShell(`<h2>This link is no longer valid</h2><p class="lead">Your reset link has expired or has already been used. Request a new link to continue.</p>
  <a class="primary" href="#/forgot" style="display:grid;place-items:center;text-decoration:none;margin-top:28px;height:48px;background:#0d1240;color:#fff;font-size:14px">Request a new link</a>${back}`);
},
done(){
  authShell(`<h2>Password reset</h2><p class="lead">Your password has been updated. Sign in with your new password to continue.</p>
  <button class="primary" id="si" style="margin-top:32px">Back to sign in</button>`);
  $('#si').onclick=()=>toast('Sign-in is not part of this design');
},
email(){
  authShell(`<h2>Reset your password</h2><p class="lead">We received a request to reset your Borek Flow password.</p>
  <div class="callout"><b>Use the secure link below to choose a new password.</b><p>If you didn’t request this change, you can ignore this email.</p></div>
  <a class="primary after-callout" href="#/reset" style="display:grid;place-items:center;text-decoration:none;height:48px;background:#0d1240;color:#fff;font-size:14px">Reset password</a>${back}${ms}`);
}
};

/* ---------- Screen picker (handoff convenience) ---------- */
function picker(){
  document.querySelector('.picker')?.remove();
  const d=document.createElement('details');d.className='picker';
  d.innerHTML='<summary>Screens</summary><div>'+
   tabs.map(([k,l])=>`<a href="#/${k}">Settings · ${l}</a>`).join('')+'<hr>'+
   [['forgot','Forgot password'],['sent','Check your email'],['email','Reset link email'],['reset','Reset password'],['done','Password reset'],['invalid','Link no longer valid']].map(([k,l])=>`<a href="#/${k}">${l}</a>`).join('')+'</div>';
  d.onclick=e=>{if(e.target.tagName==='A')d.open=false};
  document.body.append(d);
}

function route(){
  const h=(location.hash||'#/profile').slice(2);
  if(panels[h])renderSettings(h);else if(views[h])views[h]();else renderSettings('profile');
  window.scrollTo(0,0);picker();
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
