# Local development environment: API + PostgreSQL.
# Start:  docker compose up --build
# Stop:   docker compose down        (add -v to also delete the database data)
name: borek-pm-hub

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pmhub
      POSTGRES_PASSWORD: change-me   # local development only
      POSTGRES_DB: pmhub
    # Bound to this machine only: nobody on the same network can reach the database.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
      - "[::1]:${DB_HOST_PORT:-5432}:5432"   # IPv6 loopback too, or "localhost" waits ~2 s per connect
    volumes:
      - pmhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmhub -d pmhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://pmhub:change-me@db:5432/pmhub
    # Bound to this machine only: dev sign-in trusts a header, so it must not be reachable from
    # the office network or Wi-Fi.
    ports:
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
      - pmhub_uploads:/app/uploads   # task attachment files
    # Apply database migrations, create the QA accounts (only if BOOTSTRAP_*_PASSWORD is set in
    # backend/.env; safe to repeat), then start the API with auto-reload.
    command: sh -c "alembic upgrade head && python -m scripts.bootstrap_users && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  # Built bundle served by nginx (proxies /api to the API). For hot reload use `npm run dev` in
  # ./frontend instead (port 3000, proxies /api to localhost:8000).
  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
      - "[::1]:${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pmhub_pgdata:
  pmhub_uploads:
