<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access unavailable · Borek Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth">

  <!-- Brand panel -->
  <aside class="brand">
    <div class="brand__hero" role="presentation"></div>
    <div class="brand__fade" role="presentation"></div>
    <img class="brand__logo" src="assets/borek-logo.svg" width="184" height="43" alt="Borek">
    <p class="brand__eyebrow">Borek Flow</p>
    <p class="brand__headline">Work, Moving Forward.</p>
    <p class="brand__sub">One workspace for project plans, team tasks, and delivery progress.</p>
    <p class="brand__footer">Borek Flow · Secure workspace</p>
  </aside>

  <!-- Content panel -->
  <section class="auth__main">
    <div class="auth__content auth__content--status">
      <h1 class="title">Access unavailable</h1>
      <p class="body">This invitation has expired or access is no longer available.</p>

      <a class="btn btn--primary" href="sign-in.html">Use the invited account</a>
      <a class="btn btn--secondary" href="#request-invitation">Request a new invitation</a>
      <a class="btn btn--secondary" href="#projects">View other projects</a>
    </div>
  </section>
</main>

</html>
