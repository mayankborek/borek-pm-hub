name: Deploy dev

# Publishes the dev branch to the Azure dev instance only.
# Resource group: dev-borek-flow
# Host: dev-borek-flow-vm
# Site: https://dev-borek-flow.westeurope.cloudapp.azure.com
# main and every other branch are outside this workflow.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev-borek-flow
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev branch
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: da6f2311-d8ec-4123-a426-db151bca8248
          tenant-id: b806d72f-b3e4-4e7b-810c-9e5e4c339b62
          subscription-id: 66f64f11-44f9-4e7e-bdbc-c3f40c7a1ea3

      - name: Publish the dev branch
        run: |
          cat > "$RUNNER_TEMP/deploy-dev.sh" << 'EOF'
          #!/bin/bash
          set -euo pipefail
          if [ ! -f /etc/borek-flow/env.prod ]; then
            echo "Missing /etc/borek-flow/env.prod on the dev instance" >&2
            exit 1
          fi
          if [ ! -d /opt/borek-flow/.git ]; then
            git clone --branch dev --single-branch --depth 1 https://github.com/mayankborek/borek-pm-hub.git /opt/borek-flow
          fi
          cd /opt/borek-flow
          git fetch --depth 1 origin dev
          git reset --hard FETCH_HEAD
          if ! docker ps --format '{{.Names}}' | grep -qx caddy; then
            docker rm -f caddy >/dev/null 2>&1 || true
            docker run -d --name caddy --restart unless-stopped --network host \
              -v /etc/borek-flow/Caddyfile:/etc/caddy/Caddyfile:ro \
              -v caddy_data:/data \
              -v caddy_config:/config \
              caddy:2-alpine
          fi
          docker compose -f docker-compose.prod.yml --env-file /etc/borek-flow/env.prod up -d --build --remove-orphans > /var/log/borek-flow-deploy.log 2>&1
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then
              curl -fsS -o /dev/null http://127.0.0.1:3000/
              echo API_READY
              echo WEB_READY
              exit 0
            fi
            sleep 10
          done
          echo "API did not become ready" >&2
          docker compose -f docker-compose.prod.yml --env-file /etc/borek-flow/env.prod ps >&2 || true
          tail -n 120 /var/log/borek-flow-deploy.log >&2 || true
          exit 1
          EOF
          az vm run-command invoke \
            --resource-group dev-borek-flow \
            --name dev-borek-flow-vm \
            --command-id RunShellScript \
            --scripts @"$RUNNER_TEMP/deploy-dev.sh" \
            --query "value[0].message" -o tsv

      - name: Check the public site
        run: |
          curl --retry 12 --retry-delay 5 --retry-all-errors --fail --silent --show-error --location \
            --output /dev/null \
            https://dev-borek-flow.westeurope.cloudapp.azure.com/
