name: CI

# Quality gate for every pull request and every push to main/dev.
# The tests need PostgreSQL: a throwaway container is started for each run and discarded after it.
# No live or shared database is involved. (The commit and file-ownership rules are in repo-rules.yml.)

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmhub
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: pmhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmhub -d pmhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same as the default in app/core/config.py; the tests create and migrate pmhub_test themselves.
      DATABASE_URL: postgresql+asyncpg://pmhub:change-me@localhost:5432/pmhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
