server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers. `always` keeps them on error responses; they are repeated in the
    # locations below because add_header in a location replaces the inherited ones.
    include /etc/nginx/conf.d/security-headers.inc;

    # Task attachments can be large.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Single-page app: unknown paths fall back to index.html for the router.
    location / {
        try_files $uri /index.html;
    }
}
